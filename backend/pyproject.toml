[project]
name = "stockpulse-backend"
version = "1.0.0"
description = "StockPulse FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "yfinance>=1.0.0",
    "httpx>=0.25.2,<0.28",
    "cachetools==5.3.3",
    "supabase>=2.7.0",
    "python-jose[cryptography]==3.3.0",
    "slowapi==0.1.9",
    "python-dotenv==1.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.vercel]
entrypoint = "main:app"
