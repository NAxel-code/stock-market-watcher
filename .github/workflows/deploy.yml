name: Deploy Pipeline

on:
  push:
    branches: ["main"]

env:
  GCP_REGION: asia-southeast1
  SERVICE_NAME: stockpulse-api
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/stockpulse-api

jobs:
  check-config:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.GCP_PROJECT_ID }}" ] && [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP secrets (GCP_PROJECT_ID, GCP_SA_KEY) are not set. Skipping Cloud Run deploy."
          fi

  deploy-backend:
    needs: check-config
    if: needs.check-config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build Docker Image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest .

      - name: Push to GCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.GCP_REGION }}
          flags: >
            --allow-unauthenticated
            --min-instances=0
            --max-instances=5
            --memory=512Mi
            --cpu=1
            --concurrency=80
          env_vars: |
            CORS_ORIGINS=${{ secrets.FRONTEND_URL }},http://localhost:3000
          secrets: |
            SUPABASE_URL=SUPABASE_URL:latest
            SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest

  # Note: Frontend deployment is handled automatically by Vercel
  # on push to main via GitHub integration.
  notify-deploy:
    needs: [check-config, deploy-backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          if [ "${{ needs.check-config.outputs.configured }}" = "true" ]; then
            echo "✅ Backend deployed to Cloud Run: ${{ env.SERVICE_NAME }}"
          else
            echo "ℹ️ Backend deployment skipped: GCP credentials not configured in repository secrets."
          fi
          echo "✅ Frontend will be auto-deployed by Vercel on push."
